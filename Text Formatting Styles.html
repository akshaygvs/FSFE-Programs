<html>
    <head>
        <title> 
            Text Formatting Styles
        </title>
    </head>
    <body>
        <hr>
        <h1>
            Welcome to HTML5
        </h1>
        <p> 
            This is a <b>Bold Text. </b> <br>
            This is an <i>Italic Text.</i> <br>
            This is an <u>Underlined Text.</u> <br>
            This is a <s>Strikethrough Text.</s> <br>
            This is a demo for <mark>Highlight Text. </mark>
        </p>
        <hr>
    </body>
</html>
