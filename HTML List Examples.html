<html>
    <head>
        <title>
            HTML
        </title>
    </head>
    <body>
        <hr>
        <h1> 
            HTML List Examples.
        </h1>
        <h3>
            1. Ordered List
        </h3>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
        </ol>
        <h3>
            2. Unordered List
        </h3>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
        </ul>
        <h3> 
            3. Description List
        </h3>
        <dl>
            <dt> HTML </dt>
            <dd> Hypertext Markup Language </dd>

        <hr>
    </body>
</html>
